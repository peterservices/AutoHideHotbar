plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$project.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury-neoforge:$project.architectury_api_version"

    implementation include ("eu.midnightdust:midnightlib:${project.midnightlib_version}-$project.name") exclude group: "net.fabricmc.fabric-api"

    common(project(path: ':common')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'display_name', rootProject.display_name
    inputs.property 'description', rootProject.description
    inputs.property 'author', rootProject.author
    inputs.property 'credits', rootProject.credits
    inputs.property 'license', rootProject.license
    inputs.property 'source', rootProject.source
    inputs.property 'issue_tracker', rootProject.issue_tracker
    inputs.property 'loader_range', rootProject.loader_range
    inputs.property 'minecraft_range', rootProject.minecraft_range
    inputs.property 'neoforge_range', rootProject.neoforge_range
    inputs.property 'architectury_range', rootProject.architectury_range
    inputs.property 'midnightlib_version', rootProject.midnightlib_version

    filesMatching('META-INF/neoforge.mods.toml') {
        def toExpand = [:]
        inputs.properties.forEach { key, value ->
            toExpand["$key"] = "$value"
        }
        expand toExpand
    }
}

jar {
    archiveClassifier = "raw"
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()       // Remove default source set inclusion
    from(zipTree(jar.archiveFile))     // Unpack jar output (preserves Loom modifications)

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null           // shadowJar becomes the main artifact
    from rootProject.file("LICENSE")
}
