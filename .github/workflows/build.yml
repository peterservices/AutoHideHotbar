name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
    paths:
      - ".github/workflows/build.yml"
      - "**.gradle"
      - "**.properties"
      - "**/src/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Build
        run: ./gradlew build

      - name: Append -dev to end of artifact names
        run: |
          shopt -s extglob

          file=$(echo fabric/build/libs/!(*-@(raw|sources)).jar)
          base="${file%.jar}"
          ext="${file##*.}"
          mv "$file" "${base}-dev.${ext}"

          file=$(echo neoforge/build/libs/!(*-@(raw|sources)).jar)
          base="${file%.*}"
          ext="${file##*.}"
          mv "$file" "${base}-dev.${ext}"

      - name: Upload Fabric artifact
        uses: actions/upload-artifact@v7
        with:
          path: fabric/build/libs/*-dev.jar
          archive: false

      - name: Upload NeoForge artifact
        uses: actions/upload-artifact@v7
        with:
          path: neoforge/build/libs/*-dev.jar
          archive: false

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: autohidehotbar-*
          skip-decompress: true
          merge-multiple: true
      
      - name: Remove -dev from end of artifact names
        run: |
          for file in *-dev.jar; do
            new_name="${file/-dev/}"
            mv "$file" "$new_name"
          done

      - name: Upload to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: autohidehotbar-*
          tag: ${{ github.ref }}
          draft: true
          overwrite: true