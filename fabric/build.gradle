plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    api "me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version" exclude group: "net.fabricmc.fabric-api"

    common(project(path: ':common')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionFabric'))
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'display_name', rootProject.display_name
    inputs.property 'description', rootProject.description
    inputs.property 'author', rootProject.author
    inputs.property 'credits', rootProject.credits
    inputs.property 'license', rootProject.license
    inputs.property 'fabric_loader_minimum', rootProject.fabric_loader_minimum
    inputs.property 'minecraft_version', rootProject.minecraft_version
    inputs.property 'cloth_config_version', rootProject.cloth_config_version
    inputs.property 'architectury_api_version', rootProject.architectury_api_version

    filesMatching('fabric.mod.json') {
        def toExpand = [:]
        inputs.properties.forEach { key, value ->
            toExpand["$key"] = "$value"
        }
        expand toExpand
    }
}

jar {
    archiveClassifier = "raw"
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()       // Remove default source set inclusion
    from(zipTree(jar.archiveFile))     // Unpack jar output (preserves Loom modifications)

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null           // shadowJar becomes the main artifact
    from rootProject.file("LICENSE.md")
}